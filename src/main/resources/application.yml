spring:
  application:
    name: ranking-server
    version: 0.0.1-SNAPSHOT

  datasource:
    # localhost:3306 ??? ranking_game ??? ?????? ?
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # update: ??? ?? ?? ???? ???? ??? ??? ????? (??!)
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

ranking:
  secret: ${RANKING_SECRET}
  # OCI Always Free 회수(7일 누적 idle) 대비 백업 keep-alive 워크로드
  keepalive:
    enabled: true
    cron: "0 0 4 * * *"
    zone: "Asia/Seoul"